<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qoder 白嫖</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e6e6e6; display: flex; flex-direction: column; height: 100vh; }
  header { padding: 12px 16px; background: #16181d; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #23262d; }
  header h1 { font-size: 16px; flex: 1; }
  .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; background: #1e293b; }
  .badge.ok { background: #14532d; color: #86efac; }
  .badge.no { background: #7f1d1d; color: #fca5a5; }
  #main { flex: 1; overflow-y: auto; padding: 12px; }
  .card { background: #16181d; border: 1px solid #23262d; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; color: #94a3b8; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=number] { background: #0b0d11; border: 1px solid #2c313a; color: #e6e6e6; border-radius: 8px; padding: 8px 10px; font-size: 14px; }
  button { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
  button.ghost { background: #23262d; color: #cbd5e1; }
  button:active { opacity: .8; }
  .stat { font-size: 12px; color: #94a3b8; }
  code { background: #0b0d11; padding: 2px 6px; border-radius: 4px; font-size: 12px; word-break: break-all; }
  .hidden { display: none; }
  #loginUrl { word-break: break-all; font-size: 12px; color: #93c5fd; }
  .modellist { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .modelchip { background: #1e293b; border: 1px solid #2c313a; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .modelchip:active { background: #334155; }
  .modelchip .name { color: #e6e6e6; }
  .modelchip .meta { font-size: 11px; color: #64748b; }
</style>
</head>
<body>
<header>
  <h1>Qoder 白嫖</h1>
  <span id="loginBadge" class="badge no">未登录</span>
</header>
<div id="main">

  <!-- 登录 -->
  <div class="card" id="loginCard">
    <h2>账号登录（Qoder 国内版）</h2>
    <div class="row"><button onclick="startLogin()">发起设备码登录</button>
      <button class="ghost" onclick="openAuthUrl()" id="authBtn" disabled>打开授权页</button></div>
    <div id="loginStatus" class="stat">尚未发起</div>
    <div id="authUrlWrap" class="hidden"><div class="stat">授权 URL（可复制到浏览器打开）：</div><div id="loginUrl"></div></div>
    <div class="row" style="margin-top:8px"><button class="ghost" onclick="pollLogin()">我已授权，检查登录</button>
      <button class="ghost" onclick="logout()">退出登录</button></div>
  </div>

  <!-- 模型列表 -->
  <div class="card">
    <h2>可用模型</h2>
    <div class="row"><button onclick="refreshModels()">刷新模型</button></div>
    <div id="modelStatus" class="stat">登录后点击「刷新模型」</div>
    <div class="modellist" id="modelList"></div>
  </div>

  <!-- 养号 -->
  <div class="card">
    <h2>养号</h2>
    <div class="row"><button onclick="doCheckin()">立即签到</button>
      <button class="ghost" onclick="doQuota()">查额度</button></div>
    <div id="checkinResult" class="stat"></div>
    <div id="quotaResult" class="stat"></div>
  </div>

  <!-- 网关 -->
  <div class="card">
    <h2>本地网关（OpenAI 兼容）</h2>
    <div class="row">
      <input type="number" id="gwPort" value="9253" style="width:100px">
      <button onclick="gwStart()">启动</button>
      <button class="ghost" onclick="gwStop()">停止</button>
    </div>
    <div id="gwState" class="stat"></div>
    <div class="stat" id="gwBaseUrl"></div>
  </div>

</div>

<script>
function b() { return window.AndroidBridge; }
var loginNonce = null, loginVerifier = null;

function esc(s){ return String(s||'').replace(/[&<>]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

function refreshLoginBadge() {
  try {
    var a = JSON.parse(b().account());
    if (a.uid || a.access_token) {
      document.getElementById('loginBadge').textContent = '已登录: ' + (a.nickname || a.uid || '');
      document.getElementById('loginBadge').className = 'badge ok';
    }
  } catch(e) {}
}

function startLogin() {
  var r = JSON.parse(b().startLogin());
  if (r.error) { document.getElementById('loginStatus').textContent = '登录发起失败: ' + r.error; return; }
  loginNonce = r.nonce; loginVerifier = r.verifier;
  document.getElementById('loginUrl').textContent = r.authUrl;
  document.getElementById('authUrlWrap').classList.remove('hidden');
  document.getElementById('authBtn').disabled = false;
  document.getElementById('loginStatus').textContent = '已生成授权，请在浏览器打开授权 URL 并登录 Qoder 账号';
}

function openAuthUrl() {
  var u = document.getElementById('loginUrl').textContent;
  if (u) b().openUrl(u);
}

function pollLogin() {
  if (!loginNonce || !loginVerifier) { document.getElementById('loginStatus').textContent = '请先发起登录'; return; }
  var r = JSON.parse(b().pollLogin(loginNonce, loginVerifier));
  if (r.status === 'ok') {
    document.getElementById('loginStatus').textContent = '登录成功！';
    refreshLoginBadge();
    refreshModels();
  } else if (r.status === 'pending') {
    document.getElementById('loginStatus').textContent = '等待授权…（未完成，授权后点这里）';
  } else {
    document.getElementById('loginStatus').textContent = '登录失败: ' + (r.message||'');
  }
}

function logout() {
  b().logout();
  document.getElementById('loginBadge').textContent='未登录';
  document.getElementById('loginBadge').className='badge no';
  document.getElementById('loginStatus').textContent = '已退出';
}

function refreshModels() {
  var r = b().fetchModels();
  document.getElementById('modelStatus').textContent = '正在获取…';
  try {
    var j = JSON.parse(r);
    if (j.error) { document.getElementById('modelStatus').textContent = '拉取失败: ' + j.error; return; }
    var arr = j.chat || j.data || j.models || [];
    var box = document.getElementById('modelList');
    box.innerHTML = '';
    if (arr.length) {
      for (var i=0;i<arr.length;i++) {
        var m = arr[i];
        if (m.enable === false) continue;
        var key = m.key || m.id || m.model;
        if (!key) continue;
        var name = m.display_name || m.name || key;
        var chip = document.createElement('div');
        chip.className = 'modelchip';
        chip.innerHTML = '<div class="name">'+esc(name)+'</div><div class="meta">'+esc(key)+'</div>';
        chip.onclick = (function(k){ return function(){ copyText(k); }; })(key);
        box.appendChild(chip);
      }
      document.getElementById('modelStatus').textContent = '共 ' + arr.length + ' 个模型（点卡片复制模型 key）';
    } else {
      document.getElementById('modelStatus').textContent = '无可用模型';
    }
  } catch(e) {
    document.getElementById('modelStatus').textContent = '模型解析失败: ' + e;
  }
}

function copyText(t) {
  try {
    var ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    document.getElementById('modelStatus').textContent = '已复制: ' + t;
  } catch(e) {}
}

function doCheckin() {
  var r = b().checkin();
  document.getElementById('checkinResult').textContent = '签到结果: ' + r;
}

function doQuota() {
  var r = b().quota();
  document.getElementById('quotaResult').textContent = '额度: ' + r;
}

function gwStart() {
  var port = document.getElementById('gwPort').value;
  var r = JSON.parse(b().gwStart(port));
  document.getElementById('gwState').textContent = r.running ? ('运行中 · 端口 ' + r.port) : '启动失败（端口可能被占）';
  document.getElementById('gwBaseUrl').textContent = r.baseUrl || '';
}

function gwStop() {
  var r = JSON.parse(b().gwStop());
  document.getElementById('gwState').textContent = r.running ? '运行中' : '已停止';
  document.getElementById('gwBaseUrl').textContent = '';
}

refreshLoginBadge();
</script>
</body>
</html>
